      const DRAG_THRESHOLD = 4;
      const EDGE_SCROLL = 48;

      function onGripPointerDown(e) {
        if (e.button !== 0) return;
        const grip = e.target.closest("[data-grip]");
        e.preventDefault();
        grip.focus();
        grip.setPointerCapture(e.pointerId);
        axisDrag = {
          grip,
          axId: grip.dataset.ax,
          col: grip.closest(".col"),
          startX: e.clientX,
          startScroll: id("board-wrap").scrollLeft,
          x: e.clientX,
          started: false,
          target: null,
          raf: 0,
        };
        grip.addEventListener("pointermove", onGripPointerMove);
        grip.addEventListener("pointerup", onGripPointerUp);
        grip.addEventListener("pointercancel", cancelAxisDrag);
      }

      function onGripPointerMove(e) {
        const d = axisDrag;
        if (!d) return;
        d.x = e.clientX;
        if (!d.started) {
          if (Math.abs(d.x - d.startX) < DRAG_THRESHOLD) return;
          d.started = true;
          d.col.classList.add("is-dragging");
          document.body.classList.add("is-axis-dragging");
          document.addEventListener("keydown", onAxisDragKeydown, true);
          d.raf = requestAnimationFrame(axisDragFrame);
        }
        updateAxisDrag(d);
      }

      // Each frame scrolls the board while the pointer is near an edge.
      function axisDragFrame() {
        const d = axisDrag;
        if (!d) return;
        const wrap = id("board-wrap");
        const box = wrap.getBoundingClientRect();
        const before = wrap.scrollLeft;
        if (d.x < box.left + EDGE_SCROLL) wrap.scrollLeft -= 12;
        else if (d.x > box.right - EDGE_SCROLL) wrap.scrollLeft += 12;
        if (wrap.scrollLeft !== before) updateAxisDrag(d);
        d.raf = requestAnimationFrame(axisDragFrame);
      }

      function updateAxisDrag(d) {
        const dx = d.x - d.startX + (id("board-wrap").scrollLeft - d.startScroll);
        d.col.style.transform = `translateX(${dx}px)`;
        showAxisDropTarget(d);
      }

      // Where the dragged column would land: before the first other column
      // whose middle is right of the pointer.
      function showAxisDropTarget(d) {
        const others = [...id("board").querySelectorAll(".col[data-col]")].filter((c) => c !== d.col);
        let p = others.findIndex((c) => {
          const r = c.getBoundingClientRect();
          return d.x < r.left + r.width / 2;
        });
        if (p < 0) p = others.length;
        const index = boardIndexOffset() + p;
        others.forEach((c) => c.classList.remove("drop-before", "drop-after"));
        d.target = canMoveAxisTo(d.axId, index) ? index : null;
        if (d.target === null) return;
        if (p < others.length) others[p].classList.add("drop-before");
        else others[others.length - 1].classList.add("drop-after");
      }

      function endAxisDrag() {
        const d = axisDrag;
        axisDrag = null;
        cancelAnimationFrame(d.raf);
        d.grip.removeEventListener("pointermove", onGripPointerMove);
        d.grip.removeEventListener("pointerup", onGripPointerUp);
        d.grip.removeEventListener("pointercancel", cancelAxisDrag);
        document.removeEventListener("keydown", onAxisDragKeydown, true);
        document.body.classList.remove("is-axis-dragging");
        d.col.classList.remove("is-dragging");
        d.col.style.transform = "";
        id("board").querySelectorAll(".drop-before, .drop-after").forEach((c) =>
          c.classList.remove("drop-before", "drop-after"),
        );
        return d;
      }

      function onGripPointerUp(e) {
        if (!axisDrag) return;
        if (axisDrag.started) {
          axisDrag.x = e.clientX;
          updateAxisDrag(axisDrag);
        }
        const d = endAxisDrag();
        if (d.started && d.target !== null) uiMoveAxis(d.axId, d.target);
      }

      function cancelAxisDrag() {
        if (axisDrag) endAxisDrag();
      }

      function onAxisDragKeydown(e) {
        if (e.key !== "Escape") return;
        e.preventDefault();
        e.stopPropagation();
        cancelAxisDrag();
      }

      document.getElementById("board").addEventListener("pointerdown", (e) => {
        if (e.target.closest("[data-grip]")) onGripPointerDown(e);
      });
      document.getElementById("board").addEventListener("keydown", (e) => {
        if (e.target.matches && e.target.matches("[data-grip]")) onGripKeydown(e);
      });

      function uiRemoveAxis(axId) {
        const ax = axes.find((a) => a.id === axId);
        if (!ax) return;
        const used = categoriesWithValuesOn(axId);
        const msg =
          `Remove the "${ax.name}" axis from the whole project?\n\n` +
          (used.length
            ? `These categories have values on it, which will be removed:\n• ${used.join("\n• ")}`
            : "No category has values on it.") +
          `\n\nGroups whose condition uses ${ax.name} lose that part. You can undo this.`;
        if (!confirm(msg)) return;
        const cols = boardAxes();
        const neighbour = cols[cols.indexOf(ax) + 1] || cols[cols.indexOf(ax) - 1];
        pendingFocusFk = neighbour && neighbour.slot === "middle" ? "remove:" + neighbour.id : "insert-axis";
        if (edit(() => removeAxis(axId))) showToast(`Removed the "${ax.name}" axis.`);
      }

      /* Undo toast */
      let toastTimer = null;
      function showToast(msg, withUndo = true) {
        const el = id("toast");
        el.innerHTML = `<span>${esc(msg)}</span>${withUndo ? `<button type="button" data-fk="toast-undo" onclick="undo(); hideToast()">Undo</button>` : ""}`;
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(hideToast, 8000);
      }
      function hideToast() {
        clearTimeout(toastTimer);
        id("toast").hidden = true;
      }

      /* Events */
      document.addEventListener("click", (e) => {
        const pop = e.target.closest("#popover [data-pop]");
        if (pop) return onPopoverClick(pop);
        const el = e.target.closest("[data-act]");
        if (!el || el.disabled || el.tagName === "INPUT" || el.tagName === "SELECT") return;
        onBoardClick(el);
      });
      document.addEventListener("change", (e) => {
        if (e.target.closest("#popover")) return onPopoverChange(e.target);
        const el = e.target.closest("[data-act]");
        if (el && (el.tagName === "INPUT" || el.tagName === "SELECT")) onBoardChange(el);
      });
      document.addEventListener("submit", (e) => {
        const form = e.target.closest("#popover form");
        if (!form) return;
        e.preventDefault();
        onPopoverSubmit(form);
      });
      document.addEventListener("dblclick", (e) => {
        const tab = e.target.closest(".cat-tab");
        if (!tab) return;
        selectCategory(tab.dataset.cat);
        openPopover({ kind: "category" }, tab);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && popover) {
          e.preventDefault();
          return closePopover();
        }
        const t = e.target;
        if (e.key === "Enter" && t.matches && t.matches('input[type="text"][data-act]')) {
          e.preventDefault();
          if (t.dataset.act === "add-value") commitAddValue(t);
          else onBoardChange(t);
          return;
        }
        if (t.classList && t.classList.contains("cat-tab")) {
          const i = categories.findIndex((c) => c.id === t.dataset.cat);
          let j = null;
          if (e.key === "ArrowRight") j = (i + 1) % categories.length;
          else if (e.key === "ArrowLeft") j = (i - 1 + categories.length) % categories.length;
          else if (e.key === "Home") j = 0;
          else if (e.key === "End") j = categories.length - 1;
          else if (e.key === "F2") {
            e.preventDefault();
            return openPopover({ kind: "category" }, t);
          }
          if (j !== null) {
            e.preventDefault();
            selectCategory(categories[j].id, true);
          }
        }
      });
      document.addEventListener("mousedown", (e) => {
        if (!popover) return;
        if (e.target.closest("#popover")) return;
        const anchor = popover.anchorFk && e.target.closest(`[data-fk="${CSS.escape(popover.anchorFk)}"]`);
        if (!anchor) closePopover(false);
      });
      window.addEventListener("resize", positionPopover);
      document.addEventListener("scroll", positionPopover, true);

      function setProjectTitle(value) {
        const trimmed = String(value).trim();
        projectTitle = trimmed || defaultTitleForTier(tierMode);
        const el = id("project-title");
        if (el && !trimmed) el.value = projectTitle;
        scheduleAutoSave();
      }

      function syncProjectTitleUI() {
        const el = id("project-title");
        if (
          el &&
          document.activeElement !== el &&
          el.value !== projectTitle
        ) {
          el.value = projectTitle;
        }
      }

      function projectTitleToFilename(title, ext) {
        const fallback = defaultTitleForTier(tierMode);
        const trimmed = (title || fallback).trim() || fallback;
        const base =
          trimmed
            .toLowerCase()
            .replace(/[/\\?%*:|"<>]/g, "")
            .replace(/\s+/g, "-")
            .replace(/-+/g, "-")
            .replace(/^-+|-+$/g, "") || "tier-tokens";
        const cleanExt = String(ext || "").replace(/^\./, "");
        return cleanExt ? `${base}.${cleanExt}` : base;
      }

      async function downloadFile({ blob, extension, description }) {
        const suggestedName = projectTitleToFilename(projectTitle, extension);
        const acceptExt =
          "." + String(extension || "bin").replace(/^\./, "").split(".").pop();

        if (window.showSaveFilePicker) {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName,
              types: [
                {
                  description,
                  accept: { [blob.type]: [acceptExt] },
                },
              ],
            });
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
            return;
          } catch (e) {
            if (e.name === "AbortError") return;
          }
        }

        const entered = prompt("Save as:", suggestedName);
        if (entered === null) return;
        let base = entered.trim();
        const ext = String(extension || "").replace(/^\./, "");
        if (ext && base.toLowerCase().endsWith("." + ext.toLowerCase())) {
          base = base.slice(0, -(ext.length + 1));
        } else {
          base = base.replace(/\.[^.]+$/, "");
        }
        const filename = projectTitleToFilename(base, extension);
        const url = URL.createObjectURL(blob);
        const a = Object.assign(document.createElement("a"), {
          href: url,
          download: filename,
        });
        a.click();
        URL.revokeObjectURL(url);
      }

      /* ── Output panel ──────────────────────────────────── */
      // Docked at the bottom: a header with the token count, collision
      // warnings, one tab per output and Copy/Download; a body that can be
      // collapsed and resized by dragging its top edge.
      const OUT_TABS = {
        preview: { label: "Tokens Preview", copy: () => buildTokenList(outFilter) },
        dtcg: { label: "DTCG JSON", copy: buildDtcgExport, download: downloadDtcgExport },
        css: { label: "CSS Variables", copy: buildCssExport, download: downloadCssExport },
        spec: { label: "Markdown Spec", copy: buildExport, download: downloadExport },
      };
      const OUT_MIN_H = 120;
      const OUT_PREVIEW_LIMIT = 2000;
      let outTab = "preview";
      let outFilter = "";
      let outHeight = 320;
      let outCollapsed = window.matchMedia("(max-width: 899px)").matches;
      let outCopiedTimer = null;

      function outMaxHeight() {
        return Math.max(OUT_MIN_H, Math.round(window.innerHeight * 0.85));
      }

      function setOutHeight(h) {
        outHeight = Math.min(outMaxHeight(), Math.max(OUT_MIN_H, Math.round(h)));
        id("out-body").style.height = outHeight + "px";
        const handle = id("out-resize");
        handle.setAttribute("aria-valuenow", outHeight);
        handle.setAttribute("aria-valuemax", outMaxHeight());
      }

      function setOutCollapsed(collapsed) {
        outCollapsed = collapsed;
        id("out").classList.toggle("is-collapsed", collapsed);
        id("out-body").hidden = collapsed;
        id("out-resize").hidden = collapsed;
        const toggle = id("out-toggle");
        toggle.setAttribute("aria-expanded", String(!collapsed));
        toggle.setAttribute("aria-label", collapsed ? "Show output panel" : "Hide output panel");
        toggle.title = collapsed ? "Show output" : "Hide output";
        if (!collapsed) renderOutputBody();
      }

      function selectOutTab(tab, focus) {
        if (!OUT_TABS[tab]) return;
        outTab = tab;
        if (outCollapsed) setOutCollapsed(false);
        renderOutputPanel();
        if (focus) id("out-tab-" + tab).focus();
      }

      // Glows the header dot when the generated tokens (names or types) change.
      let outSignature = null;
      function pulseOutputDot() {
        const signature = JSON.stringify(allTokens());
        if (signature === outSignature) return;
        const first = outSignature === null;
        outSignature = signature;
        if (first) return;
        const dot = id("out-dot");
        dot.classList.remove("is-pulsing");
        void dot.offsetWidth; // restart the animation
        dot.classList.add("is-pulsing");
      }

      function renderOutputPanel() {
        pulseOutputDot();
        const count = tokenCount();
        id("out-count").textContent = plural(count, "token");

        // The names are on the button itself (the first few) and in its
        // accessible name; the Tokens Preview lists them per category.
        const collisions = tokenCollisions();
        const warn = id("out-warn");
        warn.hidden = !collisions.length;
        if (collisions.length) {
          const shown = collisions.slice(0, 3).join(", ") + (collisions.length > 3 ? ", …" : "");
          warn.textContent = `⚠ ${plural(collisions.length, "name collision")}: ${shown}`;
          warn.title = `CSS and tokens.json downloads are blocked while these names collide:\n${collisions.join("\n")}`;
          warn.setAttribute("aria-label", `${plural(collisions.length, "name collision")}: ${collisions.join(", ")}. Show them in Tokens Preview.`);
        }

        Object.keys(OUT_TABS).forEach((tab) => {
          const btn = id("out-tab-" + tab);
          const on = tab === outTab;
          btn.setAttribute("aria-selected", String(on));
          btn.tabIndex = on ? 0 : -1;
          id("out-panel-" + tab).hidden = !on;
        });
        const download = id("out-download");
        download.hidden = !OUT_TABS[outTab].download;
        download.setAttribute("aria-label", `Download ${OUT_TABS[outTab].label}`);
        id("out-copy").setAttribute("aria-label", `Copy ${OUT_TABS[outTab].label}`);
        if (!outCollapsed) renderOutputBody();
      }

      // Only the visible tab is drawn, and only while the panel is open.
      function renderOutputBody() {
        if (outTab === "preview") renderTokenPreview();
        else id("out-text-" + outTab).textContent = OUT_TABS[outTab].copy();
      }

      function renderTokenPreview() {
        const filter = id("out-filter");
        if (document.activeElement !== filter && filter.value !== outFilter) filter.value = outFilter;
        const list = id("out-preview-list");
        const preview = tokenPreview(outFilter);
        if (!categories.length) {
          list.innerHTML = `<p class="out-empty">Add a category to generate tokens.</p>`;
          return;
        }
        if (!preview.length) {
          list.innerHTML = outFilter
            ? `<p class="out-empty">No tokens match “${esc(outFilter.trim())}”.</p>`
            : `<p class="out-empty">No tokens yet. Add values to the axes above.</p>`;
          return;
        }
        let budget = OUT_PREVIEW_LIMIT;
        list.innerHTML = preview
          .map((c) => {
            const shown = c.tokens.slice(0, Math.max(0, budget));
            budget -= shown.length;
            const hidden = c.tokens.length - shown.length;
            const countLabel = outFilter.trim() ? `${c.tokens.length} of ${plural(c.count, "token")}` : plural(c.count, "token");
            return `<section class="out-cat" aria-label="${esc(c.name)}">
              <h3 class="out-cat-head"><span class="hue-cat">${esc(c.name)}</span>
                <span class="out-cat-meta">${countLabel}${c.type ? ` · <code>$type: ${esc(c.type)}</code>` : ""}</span></h3>
              ${c.collisions.length ? `<p class="out-cat-warn" role="note">${c.collisions.length === 1 ? "Name collision" : "Name collisions"}: ${c.collisions.map((n) => `<code>${esc(n)}</code>`).join(", ")}</p>` : ""}
              <ul class="out-tokens">${shown.map((t) => `<li class="out-token">${coloredTokenName(t)}</li>`).join("")}</ul>
              ${hidden ? `<p class="out-more">+ ${hidden} more — use the filter to narrow the list, or Copy for all of them.</p>` : ""}
            </section>`;
          })
          .join("");
      }

      function coloredTokenName(token) {
        return token.parts
          .map((p) => {
            const ax = axes.find((a) => a.id === p.axisId) || { slot: p.axisId };
            return `<span class="${hueClass(ax)}">${esc(p.val)}</span>`;
          })
          .join('<span class="out-sep">-</span>');
      }

      async function copyOutTab() {
        const text = OUT_TABS[outTab].copy();
        const status = id("out-copy-status");
        let ok = false;
        try {
          await navigator.clipboard.writeText(text);
          ok = true;
        } catch (e) {}
        clearTimeout(outCopiedTimer);
        status.textContent = ok ? "Copied" : "Copy failed";
        id("out-copy").classList.toggle("is-done", ok);
        outCopiedTimer = setTimeout(() => {
          status.textContent = "";
          id("out-copy").classList.remove("is-done");
        }, 1600);
      }

      function exportBlockedByCollisions() {
        const collisions = tokenCollisions();
        if (!collisions.length) return false;
        alert(`Cannot export while token names collide:\n\n${collisions.join("\n")}`);
        return true;
      }

      async function downloadCssExport() {
        if (exportBlockedByCollisions()) return;
        const css = buildCssExport();
        if (!css.includes("--")) return;
        await downloadFile({
          blob: new Blob([css], { type: "text/css" }),
          extension: "css",
          description: "CSS token name stubs",
        });
      }

      async function downloadDtcgExport() {
        if (exportBlockedByCollisions()) return;
        await downloadFile({
          blob: new Blob([buildDtcgExport()], { type: "application/json" }),
          extension: "tokens.json",
          description: "DTCG-shaped naming tokens",
        });
      }

      async function downloadExport() {
        await downloadFile({
          blob: new Blob([buildExport()], { type: "text/markdown" }),
          extension: "md",
          description: "Naming convention",
        });
      }

      function initOutputPanel() {
        const out = id("out");
        const tablist = id("out-tabs");
        tablist.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-out-tab]");
          if (btn) selectOutTab(btn.dataset.outTab);
        });
        tablist.addEventListener("keydown", (e) => {
          const keys = Object.keys(OUT_TABS);
          const i = keys.indexOf(outTab);
          let j = null;
          if (e.key === "ArrowRight") j = (i + 1) % keys.length;
          else if (e.key === "ArrowLeft") j = (i - 1 + keys.length) % keys.length;
          else if (e.key === "Home") j = 0;
          else if (e.key === "End") j = keys.length - 1;
          if (j === null) return;
          e.preventDefault();
          selectOutTab(keys[j], true);
        });
        id("out-toggle").addEventListener("click", () => setOutCollapsed(!outCollapsed));
        id("out-copy").addEventListener("click", copyOutTab);
        id("out-download").addEventListener("click", () => OUT_TABS[outTab].download?.());
        id("out-warn").addEventListener("click", () => selectOutTab("preview"));
        id("out-filter").addEventListener("input", (e) => {
          outFilter = e.target.value;
          renderTokenPreview();
        });

        // Drag the top edge to resize; arrow keys do the same from the keyboard.
        const handle = id("out-resize");
        handle.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          handle.setPointerCapture(e.pointerId);
          const startY = e.clientY;
          const startH = outHeight;
          out.classList.add("is-resizing");
          const move = (ev) => setOutHeight(startH + (startY - ev.clientY));
          const up = () => {
            out.classList.remove("is-resizing");
            handle.removeEventListener("pointermove", move);
            handle.removeEventListener("pointerup", up);
            handle.removeEventListener("pointercancel", up);
          };
          handle.addEventListener("pointermove", move);
          handle.addEventListener("pointerup", up);
          handle.addEventListener("pointercancel", up);
        });
        handle.addEventListener("keydown", (e) => {
          const step = e.shiftKey ? 96 : 24;
          if (e.key === "ArrowUp") setOutHeight(outHeight + step);
          else if (e.key === "ArrowDown") setOutHeight(outHeight - step);
          else if (e.key === "Home") setOutHeight(outMaxHeight());
          else if (e.key === "End") setOutHeight(OUT_MIN_H);
          else return;
          e.preventDefault();
        });
        window.addEventListener("resize", () => setOutHeight(outHeight));

        // Keep the page's last content clear of the docked panel.
        const sync = () =>
          document.documentElement.style.setProperty("--out-h", out.offsetHeight + "px");
        new ResizeObserver(sync).observe(out);

        setOutHeight(outHeight);
        setOutCollapsed(outCollapsed);
      }

      /* ── Master render ─────────────────────────────────── */
      function renderAll() {
        syncProjectTitleUI();
        updateTierModeUI();
        // Focus survives the redraw: back to the element with the same key.
        const active = document.activeElement;
        const wanted = pendingFocusFk;
        const fk = active && active.dataset ? active.dataset.fk : null;
        pendingFocusFk = null;
        renderFormulaBar();
        renderTabs();
        renderBoard();
        renderPopover();
        if (wanted) focusFk(wanted);
        else if (fk && !active.isConnected) focusFk(fk);
        renderOutputPanel();
        scheduleAutoSave();
        updateShareLinkButton();
      }

      /* ── Persistence ───────────────────────────────────── */
      const STORAGE_KEY = "tier-naming-builder:v2";
      const STORAGE_KEY_LEGACY = "tier1-axis-builder:v1";
      // When the project was last saved, kept beside it so the header can say
      // how long ago that was after a reload.
      const STORAGE_KEY_SAVED_AT = "tier-naming-builder:v2:savedAt";
      const SHARE_HASH_MAX = 6000;
      let persistEnabled = false;
      let autoSaveTimer = null;


      /* ── Undo / redo ───────────────────────────────────── */
      const MAX_HISTORY = 50;
      let undoStack = [];
      let redoStack = [];
      let isRestoringHistory = false;
      const historyFieldGuard = new Set();

      function historyOnFieldFocus(fieldKey) {
        if (isRestoringHistory) return;
        if (historyFieldGuard.has(fieldKey)) return;
        historyFieldGuard.add(fieldKey);
        pushHistory();
      }

      function historyOnFieldBlur(fieldKey) {
        historyFieldGuard.delete(fieldKey);
      }

      function pushHistory() {
        if (isRestoringHistory) return;
        undoStack.push(serializeState());
        if (undoStack.length > MAX_HISTORY) undoStack.shift();
        redoStack.length = 0;
        updateUndoRedoUI();
      }

      function restoreSnapshot(data) {
        isRestoringHistory = true;
        historyFieldGuard.clear();
        applyState(data);
        isRestoringHistory = false;
        updateUndoRedoUI();
      }

      function undo() {
        if (!undoStack.length) return;
        redoStack.push(serializeState());
        restoreSnapshot(undoStack.pop());
      }

      function redo() {
        if (!redoStack.length) return;
        undoStack.push(serializeState());
        restoreSnapshot(redoStack.pop());
      }

      function clearHistory() {
        undoStack.length = 0;
        redoStack.length = 0;
        historyFieldGuard.clear();
        updateUndoRedoUI();
      }

      function updateUndoRedoUI() {
        const undoBtn = id("undo-btn");
        const redoBtn = id("redo-btn");
        if (undoBtn) undoBtn.disabled = undoStack.length === 0;
        if (redoBtn) redoBtn.disabled = redoStack.length === 0;
      }


      function showPersistenceError(msg) {
        alert(msg);
      }

      function applyState(data) {
        const err = loadProjectState(data);
        if (err) {
          showPersistenceError(err);
          return false;
        }
        hideRestoreBanner();
        renderAll();
        return true;
      }

      // When this session last saved (ms), or null before the first save;
      // saveFailed is set while this browser won't store the project.
      let lastSavedAt = null;
      let saveFailed = false;

      function saveToStorage() {
        if (!persistEnabled) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeState()));
          lastSavedAt = Date.now();
          localStorage.setItem(STORAGE_KEY_SAVED_AT, String(lastSavedAt));
          saveFailed = false;
        } catch (e) {
          saveFailed = true;
        }
        renderSaveStatus();
      }

      function loadSavedAt() {
        try {
          const t = Number(localStorage.getItem(STORAGE_KEY_SAVED_AT));
          return t > 0 ? t : null;
        } catch (e) {
          return null;
        }
      }

      function savedAgo(ms) {
        const s = Math.max(0, Math.round(ms / 1000));
        if (s < 45) return "just now";
        const m = Math.round(s / 60);
        if (m < 60) return `${m}m ago`;
        const h = Math.round(m / 60);
        if (h < 24) return `${h}h ago`;
        return new Date(Date.now() - ms).toLocaleDateString();
      }

      function renderSaveStatus() {
        const el = id("save-status");
        el.classList.toggle("is-error", saveFailed);
        el.classList.toggle("is-saved", !saveFailed && !!lastSavedAt);
        if (saveFailed) el.textContent = "Not saved: this browser won't store it";
        else if (lastSavedAt) el.textContent = `Auto-saved · ${savedAgo(Date.now() - lastSavedAt)}`;
        else el.textContent = persistEnabled ? "Auto-save on" : "";
        el.title = lastSavedAt ? `Saved in this browser at ${new Date(lastSavedAt).toLocaleTimeString()}` : "";
      }

      function loadFromStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
          const legacy = localStorage.getItem(STORAGE_KEY_LEGACY);
          if (legacy) return JSON.parse(legacy);
          return null;
        } catch (e) {
          return null;
        }
      }

      function clearSavedState() {
        try {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(STORAGE_KEY_LEGACY);
          localStorage.removeItem(STORAGE_KEY_SAVED_AT);
        } catch (e) {}
      }

      function scheduleAutoSave() {
        if (!persistEnabled) return;
        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(saveToStorage, 300);
      }

      function showRestoreBanner() {
        const configured = axes.filter(isConfigurableAxis).length;
        const cats = `${categories.length} ${categories.length === 1 ? "category" : "categories"}`;
        const axesText = `${configured} ${configured === 1 ? "axis" : "axes"}`;
        id("restore-text").textContent = `Restored your last session from this browser (${cats}, ${axesText}).`;
        id("restore-banner").hidden = false;
      }

      function hideRestoreBanner() {
        id("restore-banner").hidden = true;
      }

      async function downloadProject() {
        const json = JSON.stringify(serializeState(), null, 2);
        await downloadFile({
          blob: new Blob([json], { type: "application/json" }),
          extension: "json",
          description: "Naming builder project",
        });
      }

      function triggerImportProject() {
        id("import-project-input").click();
      }

      function handleImportProject(evt) {
        const file = evt.target.files && evt.target.files[0];
        evt.target.value = "";
        if (!file) return;
        if (
          !confirm("Import this project? Your current work will be replaced.")
        )
          return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (applyState(data)) {
              clearSavedState();
              saveToStorage();
              clearHistory();
            }
          } catch (e) {
            showPersistenceError(
              "Could not read project file — invalid JSON.",
            );
          }
        };
        reader.onerror = () =>
          showPersistenceError("Could not read project file.");
        reader.readAsText(file);
      }

      function encodeShareHash(state) {
        const json = JSON.stringify(state);
        const bytes = new TextEncoder().encode(json);
        let binary = "";
        bytes.forEach((b) => (binary += String.fromCharCode(b)));
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }

      function decodeShareHash(encoded) {
        const b64 = encoded.replace(/-/g, "+").replace(/_/g, "/");
        const pad = b64.length % 4 ? "=".repeat(4 - (b64.length % 4)) : "";
        const binary = atob(b64 + pad);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++)
          bytes[i] = binary.charCodeAt(i);
        return JSON.parse(new TextDecoder().decode(bytes));
      }

      function parseShareHash() {
        const m = /^#s=(.+)$/.exec(location.hash);
        if (!m) return null;
        try {
          return decodeShareHash(m[1]);
        } catch (e) {
          return null;
        }
      }

      function getShareHashLength() {
        return encodeShareHash(serializeState()).length;
      }

      function updateShareLinkButton() {
        const btn = id("copy-share-link-btn");
        if (!btn) return;
        const tooLong = getShareHashLength() > SHARE_HASH_MAX;
        btn.disabled = tooLong;
        btn.title = tooLong
          ? "Config too large to share via URL — use Export project instead."
          : "Copy a link that restores this configuration";
      }

      async function copyShareLink() {
        const encoded = encodeShareHash(serializeState());
        if (encoded.length > SHARE_HASH_MAX) {
          showPersistenceError(
            "Config too large to share via URL — use Export project instead.",
          );
          return;
        }
        history.replaceState(null, "", "#s=" + encoded);
        try {
          await navigator.clipboard.writeText(location.href);
        } catch (e) {
          showPersistenceError(
            "Could not copy link — copy the URL from the address bar.",
          );
        }
      }

      function initApp() {
        const hashData = parseShareHash();
        if (hashData) {
          if (applyState(hashData)) {
            persistEnabled = true;
            clearHistory();
            return;
          }
          showPersistenceError(
            "Could not load shared link — link may be invalid or truncated.",
          );
        }

        const stored = loadFromStorage();
        if (stored) {
          const err = validateState(stored);
          if (!err && applyState(stored)) {
            lastSavedAt = loadSavedAt();
            showRestoreBanner();
            persistEnabled = true;
            clearHistory();
            return;
          }
          clearSavedState();
        }

        seedDefaultCategory();
        renderAll();
        persistEnabled = true;
        clearHistory();
      }

      /* ── Header menus ──────────────────────────────────── */
      // Export and ⋯ are menu buttons: click or ArrowDown opens the menu with
      // focus on its first item; arrows, Home and End move; Escape closes and
      // returns focus; clicking outside or tabbing away closes it.
      const MENU_ACTIONS = {
        css: downloadCssExport,
        dtcg: downloadDtcgExport,
        spec: downloadExport,
        project: downloadProject,
        share: copyShareLink,
        clear: clearAll,
      };
      let openMenuBtn = null;

      function menuItems(menu) {
        return [...menu.querySelectorAll('[role="menuitem"]:not(:disabled)')];
      }

      function openMenu(btn, focusLast) {
        if (openMenuBtn && openMenuBtn !== btn) closeMenu(false);
        const menu = id(btn.getAttribute("aria-controls"));
        menu.hidden = false;
        btn.setAttribute("aria-expanded", "true");
        openMenuBtn = btn;
        const items = menuItems(menu);
        (focusLast ? items[items.length - 1] : items[0])?.focus();
      }

      function closeMenu(returnFocus) {
        if (!openMenuBtn) return;
        const btn = openMenuBtn;
        openMenuBtn = null;
        id(btn.getAttribute("aria-controls")).hidden = true;
        btn.setAttribute("aria-expanded", "false");
        if (returnFocus) btn.focus();
      }

      function initMenus() {
        ["export-btn", "more-btn"].forEach((btnId) => {
          const btn = id(btnId);
          const menu = id(btn.getAttribute("aria-controls"));
          btn.addEventListener("click", () =>
            openMenuBtn === btn ? closeMenu(false) : openMenu(btn),
          );
          btn.addEventListener("keydown", (e) => {
            if (e.key === "ArrowDown" || e.key === "ArrowUp") {
              e.preventDefault();
              openMenu(btn, e.key === "ArrowUp");
            }
          });
          menu.addEventListener("click", (e) => {
            const item = e.target.closest("[data-menu-act]");
            if (!item || item.disabled) return;
            closeMenu(true);
            MENU_ACTIONS[item.dataset.menuAct]();
          });
          menu.addEventListener("keydown", (e) => {
            const items = menuItems(menu);
            const i = items.indexOf(document.activeElement);
            let j = null;
            if (e.key === "ArrowDown") j = (i + 1) % items.length;
            else if (e.key === "ArrowUp") j = (i - 1 + items.length) % items.length;
            else if (e.key === "Home") j = 0;
            else if (e.key === "End") j = items.length - 1;
            else if (e.key === "Escape") {
              e.preventDefault();
              e.stopPropagation();
              return closeMenu(true);
            } else if (e.key === "Tab") return closeMenu(false);
            if (j === null) return;
            e.preventDefault();
            items[j].focus();
          });
        });
        document.addEventListener("mousedown", (e) => {
          if (openMenuBtn && !e.target.closest(".menu-wrap")) closeMenu(false);
        });
      }

      /* ── Presets and Clear ─────────────────────────────── */
      // The presets and the cleared project live in the model. Loading a
      // preset, Clear and Reset to Default each replace the project as one
      // undo step.
      function loadPreset(key) {
        const project = presetProject(key);
        if (!project) return;
        pushHistory();
        const err = loadProjectState(project);
        if (err) {
          undoStack.pop();
          updateUndoRedoUI();
          showPersistenceError(err);
          return;
        }
        activeCatId = null;
        hideRestoreBanner();
        renderAll();
      }

      function clearAll() {
        pushHistory();
        clearProject();
        activeCatId = null;
        hideRestoreBanner();
        renderAll();
        showToast("Project cleared.");
      }

      /* ── Helpers ───────────────────────────────────────── */
      const id = (i) => document.getElementById(i);
      const esc = (s) =>
        String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

      /* ── Init ──────────────────────────────────────────── */
      document.addEventListener(
        "keydown",
        (e) => {
          if (!(e.metaKey || e.ctrlKey)) return;
          const key = e.key.toLowerCase();
          if (key === "z" && !e.shiftKey) {
            if (undoStack.length) {
              e.preventDefault();
              undo();
            }
          } else if ((key === "z" && e.shiftKey) || key === "y") {
            if (redoStack.length) {
              e.preventDefault();
              redo();
            }
          }
        },
        true,
      );
      initOutputPanel();
      initMenus();
      initPresetSelect();
      initApp();
      renderSaveStatus();
      setInterval(renderSaveStatus, 30000);
    </script>
  </body>
</html>
