<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Token Naming Builder — Design System Workshop</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --bg-2: #f8fafc;
        --bg-3: #eef1f6;
        --band: #e9edf4;
        --board: #f5f7fa;
        --tx: #0f172a;
        --tx-2: #475569;
        --tx-3: #8492a6;
        --bd-1: #e2e8f0;
        --bd-2: #cbd5e1;
        --bd-3: #94a3b8;
        --accent: #4f46e5;
        --accent-tx: #4338ca;
        --accent-weak: #f3f4ff;
        --accent-bd: #c7d2fe;
        --on-accent: #ffffff;
        --focus: #4f46e5;
        --danger: #dc2626;
        --warn-tx: #b45309;
        --toast-bg: #0f172a;
        --toast-tx: #f8fafc;
        --code-bg: #0f172a;
        --code-tx: #e2e8f0;
        --shadow-dock: 0 -8px 24px -12px rgba(15, 23, 42, 0.18);
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
        --shadow-lg: 0 12px 32px -8px rgba(15, 23, 42, 0.25);
        --hue-ns: #c2410c;
        --hue-cat: #1d4ed8;
        --hue-0: #6d28d9;
        --hue-1: #0e7490;
        --hue-2: #047857;
        --hue-3: #b45309;
        --hue-4: #be185d;
        --t2: #047857;
        --t2-bg: #ecfdf5;
        --r: 6px;
        --r-lg: 10px;
        --sans:
          Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
          Arial, sans-serif;
        --mono:
          "JetBrains Mono", "SF Mono", "Cascadia Code", "Fira Code", Consolas,
          "Liberation Mono", monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111726;
          --bg-2: #172033;
          --bg-3: #0b0f17;
          --band: #111726;
          --board: #0b0f17;
          --tx: #e2e8f0;
          --tx-2: #94a3b8;
          --tx-3: #64748b;
          --bd-1: #1e293b;
          --bd-2: #26334d;
          --bd-3: #3b4b63;
          --accent: #6366f1;
          --accent-tx: #a5b4fc;
          --accent-weak: rgba(99, 102, 241, 0.1);
          --accent-bd: rgba(99, 102, 241, 0.45);
          --on-accent: #ffffff;
          --focus: #06b6d4;
          --danger: #f87171;
          --warn-tx: #f59e0b;
          --toast-bg: #1e293b;
          --toast-tx: #e2e8f0;
          --code-bg: #0b0f17;
          --shadow-dock: 0 -8px 24px -12px rgba(0, 0, 0, 0.6);
          --shadow-sm: none;
          --shadow-lg: 0 12px 32px -8px rgba(0, 0, 0, 0.6);
          --hue-ns: #fb923c;
          --hue-cat: #93c5fd;
          --hue-0: #a5b4fc;
          --hue-1: #22d3ee;
          --hue-2: #34d399;
          --hue-3: #fbbf24;
          --hue-4: #f472b6;
          --t2: #10b981;
          --t2-bg: rgba(16, 185, 129, 0.12);
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--sans);
        background: var(--board);
        color: var(--tx);
        min-height: 100vh;
        overflow-x: hidden;
        line-height: 1.5;
      }
      input[type="text"],
      input[type="search"],
      input[type="number"],
      select,
      textarea {
        font-family: var(--sans);
        font-size: 13px;
        color: var(--tx);
        background: var(--bg);
        border: 0.5px solid var(--bd-2);
        border-radius: var(--r);
        padding: 0 9px;
        height: 32px;
        outline: none;
        transition: border-color 0.12s;
        width: 100%;
      }
      textarea {
        height: auto;
        padding: 7px 9px;
        resize: vertical;
        font-family: var(--mono);
        font-size: 12px;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--tx-3);
      }
      input:hover,
      select:hover,
      textarea:hover {
        border-color: var(--bd-3);
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--bd-3);
        box-shadow: 0 0 0 3px rgba(26, 26, 24, 0.05);
      }
      @media (prefers-color-scheme: dark) {
        input:focus,
        select:focus,
        textarea:focus {
          box-shadow: 0 0 0 3px rgba(240, 237, 229, 0.05);
        }
      }
      button {
        font-family: var(--sans);
        font-size: 12px;
        color: var(--tx);
        background: var(--bg);
        border: 0.5px solid var(--bd-2);
        border-radius: var(--r);
        padding: 0 11px;
        height: 30px;
        cursor: pointer;
        transition:
          background 0.1s,
          border-color 0.1s;
      }
      button:hover {
        background: var(--bg-2);
        border-color: var(--bd-3);
      }
      button:active {
        transform: scale(0.98);
      }
      .btn-solid {
        background: var(--tx);
        color: var(--bg);
        border-color: var(--tx);
      }
      .btn-solid:hover {
        opacity: 0.85;
        background: var(--tx);
      }
      .btn-ghost {
        color: var(--tx-3);
        border-color: transparent;
        background: transparent;
      }
      .btn-ghost:hover {
        background: var(--bg-2);
        border-color: var(--bd-1);
        color: var(--tx);
      }

      .page {
        background: var(--bg);
        min-width: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      /* Header */
      .app-hdr {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px 16px;
        padding: 12px 24px;
        background: var(--bg);
        border-bottom: 1px solid var(--bd-1);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        flex: 1 1 320px;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        color: var(--accent-tx);
        border: 1.5px solid var(--accent-bd);
        border-radius: 9px;
        background: var(--accent-weak);
      }
      .brand-text {
        flex-shrink: 0;
        line-height: 1.25;
      }
      .brand-name {
        font-size: 15px;
        font-weight: 700;
      }
      .brand-sub {
        font-size: 12px;
        color: var(--tx-3);
        text-decoration: none;
      }
      .brand-sub:hover {
        color: var(--tx-2);
        text-decoration: underline;
      }
      .title-input {
        flex: 1;
        min-width: 120px;
        max-width: 280px;
        height: 32px;
        font-size: 13px;
        font-weight: 600;
        border-color: transparent;
        background: transparent;
      }
      .title-input:hover {
        border-color: var(--bd-2);
      }
      .title-input:focus {
        background: var(--bg);
      }
      .tier-switch {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        background: var(--bg-3);
        border: 1px solid var(--bd-1);
        border-radius: 10px;
      }
      .tier-switch button {
        height: auto;
        min-width: 104px;
        padding: 5px 14px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--tx-2);
        font-size: 12px;
        font-weight: 500;
        line-height: 1.25;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .tier-switch button span {
        font-size: 11px;
        font-weight: 400;
      }
      .tier-switch button:hover {
        color: var(--tx);
        background: transparent;
        border-color: transparent;
      }
      .tier-switch button[aria-pressed="true"] {
        background: var(--bg);
        color: var(--accent-tx);
        font-weight: 600;
        border-color: var(--bd-1);
        box-shadow: var(--shadow-sm);
      }
      .preset-select {
        width: auto;
        max-width: 280px;
        height: 34px;
      }
      .hdr-tools {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: auto;
      }
      .hdr-history {
        display: flex;
        gap: 2px;
      }
      .hdr-icon {
        width: 32px;
        height: 32px;
        padding: 0;
        display: grid;
        place-items: center;
        border-color: transparent;
        background: transparent;
        color: var(--tx-2);
        font-size: 16px;
      }
      .hdr-icon:hover:not(:disabled) {
        color: var(--tx);
      }
      .save-status {
        font-size: 12px;
        color: var(--tx-3);
        white-space: nowrap;
      }
      .save-status.is-saved::before {
        content: "✓ ";
        color: var(--t2);
      }
      .save-status.is-error {
        color: var(--warn-tx);
      }
      .hdr-btn {
        height: 34px;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        box-shadow: var(--shadow-sm);
      }
      .hdr-btn.is-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .hdr-btn.is-primary:hover {
        background: var(--accent-tx);
        border-color: var(--accent-tx);
      }
      .menu-wrap {
        position: relative;
      }
      .menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 850;
        min-width: 220px;
        padding: 4px;
        background: var(--bg);
        border: 1px solid var(--bd-2);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
      }
      .menu[hidden] {
        display: none;
      }
      .menu [role="menuitem"] {
        border: none;
        background: transparent;
        justify-content: space-between;
        display: flex;
        align-items: center;
        gap: 16px;
        text-align: left;
        font-size: 13px;
        height: 32px;
        padding: 0 10px;
      }
      .menu [role="menuitem"] span {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--tx-3);
      }
      .menu [role="menuitem"]:hover,
      .menu [role="menuitem"]:focus {
        background: var(--bg-2);
        outline: none;
      }
      .menu [role="menuitem"]:focus-visible {
        box-shadow: inset 0 0 0 2px var(--focus);
      }
      .menu [role="menuitem"].is-danger {
        color: var(--danger);
      }
      .menu [role="menuitem"]:disabled {
        background: transparent;
      }
      @media (max-width: 899px) {
        .app-hdr {
          padding: 12px 16px;
        }
        .hdr-tools {
          margin-left: 0;
          flex-wrap: wrap;
        }
      }

      /* Restore banner: shown when a session is restored from this browser. */
      .restore-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 12px;
        padding: 8px 24px;
        font-size: 13px;
        color: var(--accent-tx);
        background: var(--accent-weak);
        border-bottom: 1px solid var(--accent-bd);
      }
      .restore-bar[hidden] {
        display: none;
      }
      .restore-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--hue-1);
        flex-shrink: 0;
      }
      .restore-text {
        flex: 1;
        min-width: 0;
      }
      .restore-actions {
        display: flex;
        gap: 4px;
      }
      .restore-btn {
        height: 28px;
        border-color: transparent;
        background: transparent;
        color: var(--tx-2);
      }
      .restore-btn.is-strong {
        color: var(--accent-tx);
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* ── Board ─────────────────────────────────────────
         Light theme follows the Stitch screenshot; dark mode uses the
         Stitch code.html palette. */
      .token-type-extension-note {
        display: block;
        color: var(--tx-3);
        font-size: 10.5px;
        margin-top: 4px;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
        border-color: var(--accent);
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* Formula syntax bar */
      .formula-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px 16px;
        padding: 12px 24px;
        background: var(--band);
        border-top: 1px solid var(--bd-1);
      }
      .formula-label {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--tx-2);
      }
      .formula {
        flex: 1 1 auto;
        min-width: 0;
        font-family: var(--mono);
        font-size: 13px;
        background: var(--bg);
        border: 1px solid var(--bd-1);
        border-radius: 6px;
        padding: 6px 12px;
        overflow-x: auto;
        white-space: nowrap;
      }
      .f-sep {
        color: var(--tx-3);
        margin: 0 6px;
      }
      .f-seg.is-unused {
        color: var(--tx-3);
        text-decoration: line-through;
      }
      .ns-field {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--tx-2);
      }
      .ns-field input {
        width: 120px;
        height: 30px;
        font-family: var(--mono);
      }
      .hue-ns { color: var(--hue-ns); }
      .hue-cat { color: var(--hue-cat); }
      .hue-0 { color: var(--hue-0); }
      .hue-1 { color: var(--hue-1); }
      .hue-2 { color: var(--hue-2); }
      .hue-3 { color: var(--hue-3); }
      .hue-4 { color: var(--hue-4); }

      /* Category tabs */
      .cat-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 24px 12px;
        background: var(--band);
        border-bottom: 1px solid var(--bd-1);
        flex-wrap: wrap;
      }
      .cat-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .cat-tab {
        height: 34px;
        padding: 0 16px;
        border: 1px solid transparent;
        background: transparent;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--tx-2);
      }
      .cat-tab:hover {
        background: var(--bg);
        border-color: var(--bd-1);
        color: var(--tx);
      }
      .cat-tab[aria-selected="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .add-cat {
        height: 34px;
        border: 1px dashed var(--bd-2);
        background: transparent;
        color: var(--tx-2);
        font-size: 13px;
      }
      .cat-bar-end {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .type-chip {
        font-family: var(--mono);
        font-size: 12px;
        height: 28px;
        background: var(--bg);
      }
      .type-chip.is-unset {
        color: var(--warn-tx);
      }

      /* Board: scrolls sideways in its own container. */
      .board-wrap {
        flex: 1 0 auto;
        background: var(--board);
        overflow-x: auto;
        overscroll-behavior-x: contain;
      }
      .board {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        padding: 24px;
        width: max-content;
        min-width: 100%;
      }
      .board:focus-visible {
        outline-offset: -4px;
      }
      .board-empty {
        color: var(--tx-2);
        font-size: 13px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .col {
        position: relative;
        width: 220px;
        flex: 0 0 auto;
        background: var(--bg);
        border: 1px solid var(--bd-1);
        border-radius: 10px;
        box-shadow: var(--shadow-sm);
      }
      .col.is-unused {
        background: var(--board);
        border-style: dashed;
        border-color: var(--bd-2);
        box-shadow: none;
      }
      /* Moving columns: the grip drags, and ← → move from the keyboard. */
      .col-grip {
        width: 24px;
        height: 24px;
        padding: 0;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        margin-left: -4px;
        border: none;
        background: transparent;
        color: var(--tx-3);
        cursor: grab;
        touch-action: none;
      }
      .col-grip svg {
        width: 16px;
        height: 16px;
      }
      .col-grip:hover {
        color: var(--tx);
        background: var(--bg-2);
      }
      .col.is-dragging {
        z-index: 5;
        opacity: 0.92;
        box-shadow: var(--shadow-lg);
        border-color: var(--accent-bd);
      }
      .col.is-dragging .col-grip,
      body.is-axis-dragging {
        cursor: grabbing;
      }
      body.is-axis-dragging {
        user-select: none;
      }
      .col.drop-before::before,
      .col.drop-after::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 3px;
        border-radius: 2px;
        background: var(--accent);
      }
      .col.drop-before::before {
        left: -10px;
      }
      .col.drop-after::after {
        right: -10px;
      }
      .col-head {
        padding: 10px 10px 8px 12px;
        border-bottom: 1px solid var(--bd-1);
      }
      .col-title {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .col-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      input.col-name {
        height: 28px;
        padding: 0 6px;
        margin-left: -6px;
        border-color: transparent;
        background: transparent;
      }
      input.col-name:hover {
        border-color: var(--bd-2);
      }
      .col.is-unused .col-name {
        text-decoration: line-through;
        color: var(--tx-3);
      }
      .col-lock {
        font-size: 10px;
        color: var(--tx-3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      /* One header row: grip, use checkbox, name (may be cut short), trash. */
      .use-axis {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
        margin: 0 4px 0 2px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .col-trash {
        flex-shrink: 0;
      }
      .icon-btn {
        width: 26px;
        height: 26px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-color: transparent;
        background: transparent;
        color: var(--tx-3);
        font-size: 13px;
      }
      .icon-btn:hover {
        color: var(--tx);
        background: var(--bg-2);
        border-color: var(--bd-1);
      }
      .icon-btn.is-danger:hover {
        color: var(--danger);
      }
      .icon-btn svg {
        width: 15px;
        height: 15px;
      }
      .col-summary {
        font-size: 11.5px;
        color: var(--tx-2);
        margin-top: 4px;
        font-family: var(--mono);
      }
      .col-summary .is-warn {
        color: var(--warn-tx);
      }
      .col-body {
        padding: 12px;
        display: grid;
        gap: 12px;
      }
      .col-unused-note {
        font-size: 12px;
        color: var(--tx-2);
        text-align: center;
        padding: 18px 8px;
        border: 1px dashed var(--bd-2);
        border-radius: 8px;
      }

      /* Groups */
      .group {
        border: 1px solid var(--bd-1);
        border-radius: 8px;
        padding: 10px;
        background: var(--bg-2);
        display: grid;
        gap: 8px;
      }
      .group.is-conditional {
        border-color: var(--accent-bd);
        background: var(--accent-weak);
      }
      .group-head {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 26px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--bd-1);
      }
      .group.is-conditional .group-head {
        border-bottom-color: var(--accent-bd);
      }
      .group-label {
        font-family: var(--mono);
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }
      .group-note,
      .group-count {
        font-size: 11px;
        color: var(--tx-3);
        margin-left: auto;
        font-family: var(--mono);
      }
      .cond-chip {
        height: 24px;
        max-width: 140px;
        padding: 0 8px;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--accent-tx);
        background: var(--bg);
        border: 1px solid var(--accent-bd);
        border-radius: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cond-chip:hover {
        background: var(--bg);
        border-color: var(--accent);
      }
      .group-settings {
        display: grid;
        gap: 6px;
      }
      .group-settings select,
      .group-settings input {
        height: 28px;
        font-size: 12px;
      }
      .range-fields {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
      .range-fields.is-single {
        grid-template-columns: 1fr;
      }
      .range-fields label {
        font-size: 10.5px;
        color: var(--tx-3);
        display: grid;
        gap: 2px;
      }
      .range-fields input {
        font-family: var(--mono);
        padding: 0 6px;
      }
      .values {
        list-style: none;
        display: grid;
        gap: 6px;
      }
      .value-row {
        position: relative;
        display: flex;
        align-items: center;
      }
      input.value-input {
        font-family: var(--mono);
        height: 32px;
        padding-right: 30px;
      }
      .value-row.is-omitted .value-input {
        color: var(--accent-tx);
        border-color: var(--accent-bd);
        padding-right: 86px;
      }
      .value-row .icon-btn {
        position: absolute;
        right: 3px;
      }
      .badge-omitted {
        position: absolute;
        right: 30px;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--accent-tx);
        background: var(--accent-weak);
        border: 1px solid var(--accent-bd);
        border-radius: 4px;
        padding: 1px 5px;
        pointer-events: none;
      }
      .values.is-generated {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .value-chip {
        font-family: var(--mono);
        font-size: 11.5px;
        padding: 2px 7px;
        border: 1px solid var(--bd-1);
        border-radius: 4px;
        background: var(--bg);
      }
      input.add-value {
        height: 30px;
        border: 1px dashed var(--bd-2);
        background: transparent;
        text-align: center;
        font-size: 12.5px;
      }
      input.add-value::placeholder {
        color: var(--tx-2);
      }
      .add-value:focus {
        text-align: left;
        font-family: var(--mono);
      }
      .group-empty {
        font-size: 11.5px;
        color: var(--tx-3);
        font-style: italic;
      }
      .add-group {
        width: 100%;
        height: 32px;
        font-size: 12.5px;
        border: 1px dashed var(--bd-2);
        background: transparent;
        color: var(--tx-2);
      }
      .col-insert {
        border: 1px dashed var(--bd-2);
        background: transparent;
        box-shadow: none;
      }
      .insert-axis {
        width: 100%;
        height: auto;
        min-height: 220px;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 8px;
        border: 0;
        background: transparent;
        border-radius: 10px;
        color: var(--tx-2);
        padding: 16px;
      }
      .insert-axis .plus {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--bd-2);
        display: grid;
        place-items: center;
        font-size: 22px;
        background: var(--bg);
      }
      .insert-axis strong {
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--tx);
      }
      .insert-axis span:last-child {
        font-size: 11.5px;
        text-align: center;
      }

      /* Popover */
      .popover {
        position: fixed;
        z-index: 900;
        width: max-content;
        min-width: 240px;
        max-width: min(360px, calc(100vw - 16px));
        max-height: min(70vh, 520px);
        overflow: auto;
        background: var(--bg);
        color: var(--tx);
        border: 1px solid var(--bd-2);
        border-radius: 10px;
        box-shadow: var(--shadow-lg);
        padding: 14px;
        display: grid;
        gap: 12px;
        font-size: 13px;
      }
      .popover[hidden] {
        display: none;
      }
      .pop-title {
        font-weight: 600;
        font-size: 13px;
      }
      .pop-hint {
        font-size: 11.5px;
        color: var(--tx-2);
      }
      .pop-hint.is-error {
        color: var(--danger);
      }
      .pop-field {
        display: grid;
        gap: 4px;
        font-size: 11.5px;
        color: var(--tx-2);
      }
      .pop-field input,
      .pop-field select {
        height: 32px;
      }
      .pop-actions {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
        align-items: center;
      }
      .pop-actions .is-danger {
        margin-right: auto;
        color: var(--danger);
      }
      .cond-row {
        display: grid;
        gap: 6px;
      }
      .cond-row-label {
        font-family: var(--mono);
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .cond-values {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .cond-toggle {
        height: 26px;
        padding: 0 9px;
        font-family: var(--mono);
        font-size: 12px;
        border-radius: 13px;
      }
      .cond-toggle[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }

      /* Undo toast */
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(var(--out-h, 0px) + 1.5rem);
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 8px 8px 14px;
        font-size: 13px;
        color: var(--toast-tx);
        background: var(--toast-bg);
        border-radius: 8px;
        box-shadow: var(--shadow-lg);
      }
      .toast[hidden] {
        display: none;
      }
      .toast button {
        height: 28px;
        color: inherit;
        background: transparent;
        border-color: currentColor;
      }

      /* Output panel: docked at the bottom, collapsible and resizable. */
      .board-wrap {
        padding-bottom: var(--out-h, 0px);
      }
      .out {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 800;
        background: var(--bg);
        border-top: 1px solid var(--bd-1);
        box-shadow: var(--shadow-dock);
        display: flex;
        flex-direction: column;
      }
      .out-resize {
        position: absolute;
        top: -4px;
        left: 0;
        right: 0;
        height: 8px;
        cursor: ns-resize;
        touch-action: none;
      }
      .out-resize::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 50%;
        width: 40px;
        height: 3px;
        margin-left: -20px;
        border-radius: 2px;
        background: var(--bd-2);
        transition: background 0.12s;
      }
      .out-resize:hover::after,
      .out-resize:focus-visible::after,
      .out.is-resizing .out-resize::after {
        background: var(--accent);
      }
      .out-resize:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }
      .out.is-resizing {
        user-select: none;
      }
      .out-head {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 12px;
        padding: 8px 20px;
        background: var(--bg-2);
        border-bottom: 1px solid var(--bd-1);
      }
      .out.is-collapsed .out-head {
        border-bottom: none;
      }
      .out-toggle {
        width: 30px;
        height: 30px;
        padding: 0;
        display: grid;
        place-items: center;
        color: var(--tx-2);
        border: 1px solid var(--bd-1);
        background: var(--bg);
      }
      .out-toggle:hover {
        color: var(--tx);
      }
      .out-chevron {
        display: block;
        transition: transform 0.15s;
      }
      .out-title {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      /* The dot glows briefly each time the generated tokens change. */
      .out-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
      .out-dot.is-pulsing {
        animation: out-dot-glow 0.9s ease-out;
      }
      @keyframes out-dot-glow {
        0% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.65), 0 0 4px 1px rgba(16, 185, 129, 0.8);
        }
        100% {
          box-shadow: 0 0 0 9px rgba(16, 185, 129, 0), 0 0 0 0 rgba(16, 185, 129, 0);
        }
      }
      .out.is-collapsed .out-chevron {
        transform: rotate(-90deg);
      }
      .out-count {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 600;
        color: var(--accent-tx);
        background: var(--accent-weak);
        border: 1px solid var(--accent-bd);
        border-radius: 999px;
        padding: 1px 9px;
      }
      .out-warn {
        height: 24px;
        font-size: 11px;
        font-weight: 600;
        color: var(--warn-tx);
        background: transparent;
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 0 9px;
      }
      .out-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .out-tabs {
        display: flex;
        gap: 2px;
        padding: 2px;
        background: var(--bg-3);
        border: 1px solid var(--bd-1);
        border-radius: 8px;
      }
      .out-tabs button {
        height: 26px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--tx-2);
        font-weight: 500;
        border-radius: 6px;
      }
      .out-tabs button:hover {
        color: var(--tx);
        background: transparent;
        border-color: transparent;
      }
      .out-tabs button[aria-selected="true"] {
        background: var(--bg);
        color: var(--accent-tx);
        font-weight: 600;
        border-color: var(--bd-1);
        box-shadow: var(--shadow-sm);
      }
      .out-btn {
        height: 28px;
      }
      .out-btn.is-done {
        color: var(--t2);
        border-color: currentColor;
      }
      .out-body {
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .out-panel {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .out-body[hidden],
      .out-panel[hidden] {
        display: none;
      }
      .out-note {
        font-size: 12px;
        color: var(--tx-2);
        padding: 8px 20px;
        border-bottom: 1px solid var(--bd-1);
      }
      .out-note a {
        color: var(--accent-tx);
      }
      .out-code {
        flex: 1;
        min-height: 0;
        overflow: auto;
        margin: 0;
        padding: 14px 20px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.6;
        color: var(--code-tx);
        background: var(--code-bg);
        white-space: pre;
        tab-size: 2;
      }
      .out-code:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }
      .out-filter-row {
        padding: 10px 20px;
        border-bottom: 1px solid var(--bd-1);
        background: var(--bg-2);
      }
      input.out-filter {
        max-width: 360px;
        font-family: var(--mono);
        font-size: 12px;
        height: 30px;
      }
      .out-preview-list {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 12px 20px 16px;
      }
      .out-cat + .out-cat {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--bd-1);
      }
      .out-cat-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .out-cat-meta {
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 400;
        color: var(--tx-3);
      }
      .out-cat-meta code {
        font-family: var(--mono);
      }
      .out-cat-warn {
        font-size: 12px;
        color: var(--warn-tx);
        margin-bottom: 8px;
      }
      .out-tokens {
        list-style: none;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 6px;
      }
      .out-token {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        padding: 6px 10px;
        background: var(--bg-2);
        border: 1px solid var(--bd-1);
        border-radius: var(--r);
        overflow-wrap: anywhere;
      }
      .out-sep {
        color: var(--tx-3);
        font-weight: 400;
      }
      .out-more,
      .out-empty {
        font-size: 12px;
        color: var(--tx-3);
        margin-top: 8px;
      }
      .out-empty {
        text-align: center;
        padding: 20px 0;
      }
      @media (max-width: 899px) {
        .out-head {
          padding: 8px 16px;
        }
        .out-actions {
          margin-left: 0;
          width: 100%;
        }
        .out-tabs {
          overflow-x: auto;
          max-width: 100%;
        }
        .out-tabs button {
          white-space: nowrap;
        }
        .out-code,
        .out-preview-list,
        .out-filter-row,
        .out-note {
          padding-left: 16px;
          padding-right: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
        button:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div id="restore-banner" class="restore-bar" role="status" hidden>
        <span class="restore-dot" aria-hidden="true"></span>
        <span class="restore-text" id="restore-text">Restored your last session from this browser.</span>
        <div class="restore-actions">
          <button type="button" class="restore-btn" onclick="hideRestoreBanner()">Dismiss</button>
          <button type="button" class="restore-btn is-strong" onclick="clearAll()">Reset to Default</button>
        </div>
      </div>

      <header class="app-hdr">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
          </span>
          <div class="brand-text">
            <p class="brand-name">Token Naming Builder</p>
            <a class="brand-sub" href="../index.html">Design Tokens Workshop</a>
          </div>
          <input
            id="project-title"
            class="title-input"
            type="text"
            value="Tier 1 Tokens"
            maxlength="80"
            aria-label="Project title"
            spellcheck="false"
            onfocus="historyOnFieldFocus('projectTitle')"
            onblur="historyOnFieldBlur('projectTitle')"
            oninput="setProjectTitle(this.value)"
          />
        </div>

        <div class="tier-switch" role="group" aria-label="Token tier">
          <button type="button" id="tier-btn-1" aria-pressed="true" onclick="setTierMode('tier1')">
            Tier 1<span>Primitive</span>
          </button>
          <button type="button" id="tier-btn-2" aria-pressed="false" onclick="setTierMode('tier2')">
            Tier 2<span>Semantic</span>
          </button>
        </div>

        <select id="preset-select" class="preset-select" aria-label="Load a preset" onchange="onPresetSelect(this)"></select>

        <div class="hdr-tools">
          <div class="hdr-history">
            <button type="button" class="hdr-icon" id="undo-btn" onclick="undo()" disabled aria-label="Undo" title="Undo (⌘Z)">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
            </button>
            <button type="button" class="hdr-icon" id="redo-btn" onclick="redo()" disabled aria-label="Redo" title="Redo (⇧⌘Z)">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
            </button>
          </div>
          <span class="save-status" id="save-status" role="status"></span>
          <button type="button" class="hdr-btn" onclick="triggerImportProject()">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
            Import
          </button>
          <input type="file" id="import-project-input" accept=".json,application/json" hidden onchange="handleImportProject(event)" />
          <div class="menu-wrap">
            <button type="button" class="hdr-btn is-primary" id="export-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
              Export <span aria-hidden="true">▾</span>
            </button>
            <div class="menu" id="export-menu" role="menu" aria-labelledby="export-btn" hidden>
              <button type="button" role="menuitem" tabindex="-1" data-menu-act="css">CSS variables <span>.css</span></button>
              <button type="button" role="menuitem" tabindex="-1" data-menu-act="dtcg">Design tokens <span>.tokens.json</span></button>
              <button type="button" role="menuitem" tabindex="-1" data-menu-act="spec">Markdown spec <span>.md</span></button>
              <button type="button" role="menuitem" tabindex="-1" data-menu-act="project">Project file <span>.json</span></button>
            </div>
          </div>
          <div class="menu-wrap">
            <button type="button" class="hdr-icon" id="more-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu" aria-label="More actions">⋯</button>
            <div class="menu" id="more-menu" role="menu" aria-labelledby="more-btn" hidden>
              <button type="button" role="menuitem" tabindex="-1" data-menu-act="share" id="copy-share-link-btn">Copy share link</button>
              <button type="button" role="menuitem" tabindex="-1" data-menu-act="clear" class="is-danger">Clear project</button>
            </div>
          </div>
        </div>
      </header>

      <section class="formula-bar" aria-label="Formula">
        <span class="formula-label" id="formula-label">Formula syntax</span>
        <div class="formula" id="formula" aria-labelledby="formula-label"></div>
        <label class="ns-field">
          Namespace:
          <input
            type="text"
            id="namespace-input"
            placeholder="none"
            autocomplete="off"
            spellcheck="false"
            onfocus="historyOnFieldFocus('namespace')"
            onblur="historyOnFieldBlur('namespace'); renderFormulaBar()"
            oninput="uiSetNamespace(this.value)"
          />
        </label>
      </section>

      <nav class="cat-bar" aria-label="Categories">
        <div class="cat-tabs" id="cat-tabs" role="tablist" aria-label="Categories"></div>
        <button type="button" class="add-cat" data-act="new-category" data-fk="add-cat" aria-haspopup="dialog">
          + Add Category
        </button>
        <div class="cat-bar-end">
          <button type="button" class="type-chip" id="type-chip" data-act="edit-category" data-fk="type-chip" aria-haspopup="dialog"></button>
          <button type="button" class="icon-btn" id="cat-menu-btn" data-act="edit-category" data-fk="cat-menu" aria-haspopup="dialog" aria-label="Category settings">⋯</button>
        </div>
      </nav>

      <main class="board-wrap" id="board-wrap">
        <div class="board" id="board" role="tabpanel" tabindex="-1"></div>
        <span class="visually-hidden" id="board-status" role="status"></span>
      </main>
    </div>

    <section class="out" id="out" aria-label="Output">
      <div class="out-resize" id="out-resize" role="separator" tabindex="0"
        aria-orientation="horizontal" aria-controls="out-body" aria-label="Resize output panel"
        aria-valuemin="120" title="Drag to resize"></div>
      <header class="out-head">
        <button type="button" class="out-toggle" id="out-toggle" aria-controls="out-body" aria-expanded="true">
          <svg class="out-chevron" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 5.5h10L8 11.5z" fill="currentColor"/></svg>
        </button>
        <h2 class="out-title"><span class="out-dot" id="out-dot" aria-hidden="true"></span>Live Cartesian Permutation Engine</h2>
        <span class="out-count" id="out-count" aria-live="polite"></span>
        <button type="button" class="out-warn" id="out-warn" hidden></button>
        <div class="out-actions">
          <div class="out-tabs" id="out-tabs" role="tablist" aria-label="Output format">
            <button type="button" role="tab" id="out-tab-preview" data-out-tab="preview" aria-controls="out-panel-preview">Tokens Preview</button>
            <button type="button" role="tab" id="out-tab-dtcg" data-out-tab="dtcg" aria-controls="out-panel-dtcg">DTCG JSON</button>
            <button type="button" role="tab" id="out-tab-css" data-out-tab="css" aria-controls="out-panel-css">CSS Variables</button>
            <button type="button" role="tab" id="out-tab-spec" data-out-tab="spec" aria-controls="out-panel-spec">Markdown Spec</button>
          </div>
          <button type="button" class="out-btn" id="out-copy">Copy</button>
          <button type="button" class="out-btn" id="out-download">Download</button>
          <span class="visually-hidden" id="out-copy-status" role="status"></span>
        </div>
      </header>
      <div class="out-body" id="out-body">
        <div class="out-panel out-preview" id="out-panel-preview" role="tabpanel" aria-labelledby="out-tab-preview">
          <div class="out-filter-row">
            <input type="search" id="out-filter" class="out-filter" placeholder="Filter generated tokens…"
              aria-label="Filter generated tokens" spellcheck="false" autocomplete="off" />
          </div>
          <div class="out-preview-list" id="out-preview-list"></div>
        </div>
        <div class="out-panel" id="out-panel-dtcg" role="tabpanel" aria-labelledby="out-tab-dtcg" hidden>
          <p class="out-note">Names and types only. <a href="token-value-builder.html">Fill values →</a></p>
          <pre class="out-code" id="out-text-dtcg" tabindex="0"></pre>
        </div>
        <div class="out-panel" id="out-panel-css" role="tabpanel" aria-labelledby="out-tab-css" hidden>
          <pre class="out-code" id="out-text-css" tabindex="0"></pre>
        </div>
        <div class="out-panel" id="out-panel-spec" role="tabpanel" aria-labelledby="out-tab-spec" hidden>
          <pre class="out-code" id="out-text-spec" tabindex="0"></pre>
        </div>
      </div>
    </section>

    <div id="popover" class="popover" role="dialog" aria-labelledby="pop-title" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="token-naming-model.js"></script>
    <script>
      function setTierMode(mode) {
        if (mode !== "tier1" && mode !== "tier2") return;
        if (mode === tierMode) return;
        pushHistory();
        const prevTitle = projectTitle;
        tierMode = mode;
        if (isDefaultProjectTitle(prevTitle)) {
          projectTitle = defaultTitleForTier(mode);
        }
        syncScaleAxisForTier();
        renderAll();
      }

      function updateTierModeUI() {
        id("tier-btn-1").setAttribute("aria-pressed", String(tierMode === "tier1"));
        id("tier-btn-2").setAttribute("aria-pressed", String(tierMode === "tier2"));
        renderPresetSelect();
      }

      // The preset dropdown lists the current tier's presets. It always shows
      // its prompt; choosing a preset loads it and resets the dropdown.
      function renderPresetSelect() {
        const select = id("preset-select");
        if (select.dataset.tier === tierMode) return;
        select.dataset.tier = tierMode;
        select.innerHTML =
          `<option value="">Load a ${tierMode === "tier2" ? "Tier 2" : "Tier 1"} preset…</option>` +
          presetsForTier(tierMode)
            .map((p) => `<option value="${esc(p.key)}">${esc(p.label)}</option>`)
            .join("");
      }

      // Some browsers fire change while the arrow keys move through a closed
      // select. Choices made with the arrows wait for Enter; anything else
      // (a click, or Enter in the open list) loads straight away.
      let presetArrowBrowsing = false;

      function onPresetSelect(select) {
        if (presetArrowBrowsing) return;
        const key = select.value;
        select.value = "";
        if (key) loadPreset(key);
      }

      function initPresetSelect() {
        const select = id("preset-select");
        select.addEventListener("keydown", (e) => {
          if (e.key === "ArrowUp" || e.key === "ArrowDown") presetArrowBrowsing = true;
          else if (e.key === "Enter" && presetArrowBrowsing) {
            e.preventDefault();
            presetArrowBrowsing = false;
            onPresetSelect(select);
          }
        });
        select.addEventListener("mousedown", () => (presetArrowBrowsing = false));
        select.addEventListener("blur", () => {
          presetArrowBrowsing = false;
          select.value = "";
        });
      }

      function dtcgTypeOptionsHtml(cur) {
        const fundOpts = DTCG_FUNDAMENTAL_TYPES.map(
          (t) =>
            `<option value="${t}"${cur === t ? " selected" : ""}>${t}</option>`,
        ).join("");
        const compOpts = DTCG_COMPOSITE_TYPES.map(
          (t) =>
            `<option value="${t}"${cur === t ? " selected" : ""}>${t}</option>`,
        ).join("");
        const extensionOpts = TERRAZZO_EXTENSION_TYPES.map(
          (t) =>
            `<option value="${t}"${cur === t ? " selected" : ""}>${t}</option>`,
        ).join("");
        return `<option value=""${cur === "" ? " selected" : ""}>Select token type…</option>
          <optgroup label="DTCG Fundamental Types">${fundOpts}</optgroup>
          <optgroup label="DTCG Composite Types">${compOpts}</optgroup>
          <optgroup label="Terrazzo Extensions">${extensionOpts}</optgroup>`;
      }

      function isTerrazzoExtensionType(type) {
        return TERRAZZO_EXTENSION_TYPES.includes(type);
      }

      /* ── Board ─────────────────────────────────────────── */
      // The board edits the project only through the model's board edits
      // (token-naming-model.js). Elements that can hold focus carry a
      // data-fk key so focus survives a re-render.
      let activeCatId = null;
      let pendingFocusFk = null;

      const GENERATOR_LABELS = {
        custom: "Literal list",
        numeric: "Numeric range",
        ordinal: "Ordinal (100–900)",
        tshirt: "T-shirt sizes",
      };
      const GRIP_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>`;
      const TRASH_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>`;

      function activeCategory() {
        let c = categories.find((x) => x.id === activeCatId);
        if (!c) {
          c = categories[0] || null;
          activeCatId = c ? c.id : null;
        }
        return c;
      }

      function isScaleAxis(ax) {
        return ax.slot === "scale" || ax.id === "scale" || ax.name === "scale";
      }

      function boardAxes() {
        return axes.filter(isConfigurableAxis);
      }

      function hueClass(ax) {
        if (ax.slot === "namespace") return "hue-ns";
        if (ax.slot === "category") return "hue-cat";
        return "hue-" + (boardAxes().indexOf(ax) % 5);
      }

      function plural(n, word) {
        return `${n} ${word}${n === 1 ? "" : "s"}`;
      }

      // Applies one board edit as one undo step and redraws. fn returns false
      // when the model refused the edit; nothing is recorded then.
      function edit(fn) {
        if (isRestoringHistory) return false;
        const before = serializeState();
        if (fn() === false) {
          renderAll(); // puts back any field the user typed into
          return false;
        }
        if (JSON.stringify(serializeState()) === JSON.stringify(before)) {
          renderAll();
          return true;
        }
        undoStack.push(before);
        if (undoStack.length > MAX_HISTORY) undoStack.shift();
        redoStack.length = 0;
        updateUndoRedoUI();
        renderAll();
        return true;
      }

      function focusFk(fk) {
        if (!fk) return false;
        const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
        if (!el || el.disabled) return false;
        el.focus();
        return true;
      }

      /* Formula bar */
      function uiSetNamespace(val) {
        setNamespace(val);
        renderFormulaBar();
        renderOutputPanel();
        scheduleAutoSave();
        updateShareLinkButton();
      }

      function renderFormulaBar() {
        const c = activeCategory();
        id("formula").innerHTML = axes
          .map((ax) => {
            const entry = c && isConfigurableAxis(ax) ? c.values[ax.id] : null;
            const label = `{${esc(ax.name)}}`;
            return entry && entry.unused
              ? `<s class="f-seg ${hueClass(ax)} is-unused" title="Unused for ${esc(c.name)}">${label}</s>`
              : `<span class="f-seg ${hueClass(ax)}">${label}</span>`;
          })
          .join('<span class="f-sep">.</span>');
        const ns = id("namespace-input");
        if (ns && document.activeElement !== ns) ns.value = namespaceValue;
      }

      /* Category tabs */
      function renderTabs() {
        const c = activeCategory();
        const list = id("cat-tabs");
        const tabs = [...list.children];
        const same =
          tabs.length === categories.length &&
          tabs.every((t, i) => t.dataset.cat === categories[i].id && t.textContent === categories[i].name);
        if (same) {
          // Update in place so a double-click on a tab still lands on it.
          tabs.forEach((t) => {
            const on = t.dataset.cat === activeCatId;
            t.setAttribute("aria-selected", on);
            t.tabIndex = on ? 0 : -1;
          });
        } else list.innerHTML = categories
          .map(
            (cat) => `<button type="button" role="tab" class="cat-tab" id="tab-${esc(cat.id)}"
              data-act="select-category" data-cat="${esc(cat.id)}" data-fk="tab:${esc(cat.id)}"
              aria-selected="${cat === c}" aria-controls="board" tabindex="${cat === c ? 0 : -1}"
              title="Double-click to rename or set its token type">${esc(cat.name)}</button>`,
          )
          .join("");
        const chip = id("type-chip");
        const menu = id("cat-menu-btn");
        chip.hidden = menu.hidden = !c;
        if (c) {
          chip.textContent = `$type: ${c.dtcgType || "not set"}`;
          chip.classList.toggle("is-unset", !c.dtcgType);
          chip.setAttribute("aria-label", `Token type for ${c.name}: ${c.dtcgType || "not set"}. Edit`);
          menu.setAttribute("aria-label", `Settings for category ${c.name}`);
        }
      }

      function selectCategory(catId, focus) {
        activeCatId = catId;
        closePopover(false);
        renderFormulaBar();
        renderTabs();
        renderBoard();
        if (focus) focusFk("tab:" + catId);
      }

      /* Columns */
      function renderBoard() {
        const el = id("board");
        const c = activeCategory();
        if (!c) {
          el.removeAttribute("aria-labelledby");
          el.innerHTML = `<div class="board-empty">No categories yet.
            <button type="button" data-act="new-category" data-fk="empty-add-cat" aria-haspopup="dialog">+ Add Category</button></div>`;
          return;
        }
        el.setAttribute("aria-labelledby", "tab-" + c.id);
        el.innerHTML = boardAxes().map((ax) => renderColumn(c, ax)).join("") + renderInsertColumn();
      }

      function renderColumn(c, ax) {
        const entry = c.values[ax.id] || mkAxisEntry();
        const unused = !!entry.unused;
        const middle = ax.slot === "middle";
        const conds = conditionalGroups(entry);
        const valueCount = groupValues(entry.groups).length;
        const a = `data-ax="${esc(ax.id)}"`;
        const name = middle
          ? `<input type="text" class="col-name ${hueClass(ax)}" value="${esc(ax.name)}" aria-label="Axis name" data-act="rename-axis" ${a} data-fk="axname:${esc(ax.id)}" spellcheck="false" />`
          : `<span class="col-name ${hueClass(ax)}">${esc(ax.name)}</span><span class="col-lock" title="Tier 1 keeps scale last">fixed</span>`;
        const summary = unused
          ? `Unused for ${esc(c.name)}`
          : `${valueCount ? plural(valueCount, "value") : `<span class="is-warn">no values</span>`} · ${conds.length ? plural(conds.length, "group") + " + ALL" : "ALL only"}`;
        // The grip moves the column: drag it, or use ← → (Home/End) on it.
        const grip = middle
          ? `<button type="button" class="col-grip" data-grip ${a} data-fk="grip:${esc(ax.id)}"
              aria-label="Move the ${esc(ax.name)} axis. Drag, or use the left and right arrow keys"
              aria-describedby="board-status" title="Drag to move (or ← →)">${GRIP_ICON}</button>`
          : "";
        // The checkbox is positive: ticked means the axis is in this
        // category's names; unticked marks it Unused.
        const useBox = `<input type="checkbox" class="use-axis" data-act="toggle-used" ${a} data-fk="used:${esc(ax.id)}" ${unused ? "" : "checked"}
            aria-label="Use ${esc(ax.name)} in ${esc(c.name)} names" title="Use ${esc(ax.name)} in ${esc(c.name)} names (untick to mark it Unused)" />`;
        const trash = middle
          ? `<button type="button" class="icon-btn is-danger col-trash" data-act="remove-axis" ${a} data-fk="remove:${esc(ax.id)}" aria-label="Remove the ${esc(ax.name)} axis from the project" title="Remove axis from the project">${TRASH_ICON}</button>`
          : "";
        const body = unused
          ? `<p class="col-unused-note">Unused for <strong>${esc(c.name)}</strong>: its names skip this axis. Tick the box to bring it back.</p>`
          : [allGroup(entry), ...conds].map((g) => renderGroup(c, ax, g, conds.length)).join("") +
            renderAddGroup(c, ax);
        return `
        <section class="col${unused ? " is-unused" : ""}" data-col="${esc(ax.id)}" aria-label="${esc(ax.name)} axis">
          <header class="col-head">
            <div class="col-title">${grip}${useBox}${name}${trash}</div>
            <div class="col-summary">${summary}</div>
          </header>
          <div class="col-body">${body}</div>
        </section>`;
      }

      function renderAddGroup(c, ax) {
        // Groups need an earlier axis with values to make a condition from.
        if (!conditionOptions(c.id, ax.id).length) return "";
        return `<button type="button" class="add-group" data-act="new-group" data-ax="${esc(ax.id)}" data-fk="addgroup:${esc(ax.id)}" aria-haspopup="dialog">+ add group</button>`;
      }

      function renderGroup(c, ax, g, conditionalCount) {
        const isAll = isAllGroup(g);
        const gen = g.generator;
        const vals = genValues(gen);
        const ref = `data-ax="${esc(ax.id)}" data-group="${esc(g.id)}"`;
        const gk = esc(g.id);
        const head = isAll
          ? `<span class="group-label">ALL</span><span class="group-note">${conditionalCount ? "when no group matches" : "every name"}</span>`
          : `<button type="button" class="cond-chip" data-act="edit-condition" ${ref} data-fk="chip:${gk}" aria-haspopup="dialog"
              aria-label="Condition: ${esc(describeCondition(g.condition))}. Edit condition" title="${esc(describeCondition(g.condition))}">${esc(conditionSummary(g.condition))} ▾</button>
             <span class="group-count">${plural(vals.length, "value")}</span>
             <button type="button" class="icon-btn is-danger" data-act="remove-group" ${ref} data-fk="rmgroup:${gk}" aria-label="Remove the group for ${esc(describeCondition(g.condition))}">✕</button>`;

        // Ranges and t-shirt sizes are for the scale axis. Other axes are
        // literal lists, unless an older project gave a group a generator.
        const showGenerator = isScaleAxis(ax) || gen.type !== "custom";
        const genSelect = !showGenerator ? "" : `<select data-act="set-generator" ${ref} data-fk="gen:${gk}" aria-label="How these ${esc(ax.name)} values are made">
          ${Object.entries(GENERATOR_LABELS).map(([k, label]) => `<option value="${k}"${gen.type === k ? " selected" : ""}>${label}</option>`).join("")}
        </select>`;
        const cfg = gen.config || {};
        const field = (key, label, fallback) =>
          `<label>${label}<input type="text" inputmode="decimal" value="${esc(cfg[key] ?? fallback)}" data-act="set-config" data-key="${key}" ${ref} data-fk="cfg:${gk}:${key}" /></label>`;
        let range = "";
        if (gen.type === "numeric") range = `<div class="range-fields">${field("start", "start", "4")}${field("end", "end", "64")}${field("step", "step", "4")}</div>`;
        else if (gen.type === "ordinal") range = `<div class="range-fields">${field("start", "start", "100")}${field("end", "end", "900")}${field("step", "step", "100")}</div>`;
        else if (gen.type === "tshirt") range = `<div class="range-fields is-single">${field("extra", "extra sizes (adds 2xs, 2xl …)", "0")}</div>`;

        let typeSelect = "";
        if (!isAll && canSetGroupTokenType(g)) {
          typeSelect = `<select data-act="set-group-type" ${ref} data-fk="gtype:${gk}" aria-label="Token type for names this group matches">
            <option value=""${g.tokenType ? "" : " selected"}>$type: category's (${esc(c.dtcgType || "not set")})</option>
            ${dtcgTypeOptionsHtml(g.tokenType || "").replace(/<option value=""[^>]*>[^<]*<\/option>/, "")}
          </select>`;
        }

        let values;
        if (gen.type === "custom") {
          values = `<ul class="values" aria-label="${esc(ax.name)} values">${(gen.list || [])
            .map((v, i) => {
              const omitted = isOmittedAxisValue(v);
              return `<li class="value-row${omitted ? " is-omitted" : ""}">
                <input type="text" class="value-input" value="${esc(v)}" data-act="rename-value" data-index="${i}" ${ref} data-fk="val:${gk}:${i}" aria-label="${esc(ax.name)} value ${i + 1}${omitted ? " (omitted from names)" : ""}" spellcheck="false" />
                ${omitted ? `<span class="badge-omitted" title="Makes a token but adds nothing to its name">omitted</span>` : ""}
                <button type="button" class="icon-btn" data-act="remove-value" data-index="${i}" ${ref} data-fk="rmval:${gk}:${i}" aria-label="Remove ${esc(v)}">✕</button>
              </li>`;
            })
            .join("")}</ul>
            <input type="text" class="add-value" placeholder="+ add ${esc(ax.name)}" data-act="add-value" ${ref} data-fk="add:${gk}" aria-label="Add a ${esc(ax.name)} value; use [brackets] to leave it out of names" spellcheck="false" />`;
        } else {
          // Adding a value turns a generated range into a literal list of its values.
          values = `<ul class="values is-generated" aria-label="${esc(ax.name)} values">${vals.map((v) => `<li class="value-chip">${esc(v)}</li>`).join("")}</ul>
            <input type="text" class="add-value" placeholder="+ add ${esc(ax.name)}" data-act="add-value" ${ref} data-fk="add:${gk}" aria-label="Add a ${esc(ax.name)} value; this turns the range into a literal list" title="Adding a value turns this range into a literal list" spellcheck="false" />`;
        }
        const empty = vals.length
          ? ""
          : `<p class="group-empty">${isAll ? "No values: this axis adds nothing to names." : "No values: names this group matches skip this axis."}</p>`;
        return `<div class="group${isAll ? "" : " is-conditional"}" role="group" aria-label="${isAll ? "ALL group" : "Group for " + esc(describeCondition(g.condition))}">
          <div class="group-head">${head}</div>
          ${genSelect || range || typeSelect ? `<div class="group-settings">${genSelect}${range}${typeSelect}</div>` : ""}
          ${values}${empty}
        </div>`;
      }

      function renderInsertColumn() {
        return `<div class="col col-insert">
          <button type="button" class="insert-axis" data-act="insert-axis" data-fk="insert-axis" aria-haspopup="dialog">
            <span class="plus" aria-hidden="true">+</span>
            <strong>Insert axis</strong>
            <span>Adds an axis to every category</span>
          </button>
        </div>`;
      }

      /* Popovers */
      // popover: {kind, anchorFk, axId?, groupId?, draft?, error?}
      let popover = null;

      function openPopover(state, anchor) {
        popover = { ...state, anchorFk: anchor && anchor.dataset.fk };
        renderPopover();
        const el = id("popover");
        const first = el.querySelector("[autofocus], input, select, button:not([disabled])");
        if (first) {
          first.focus();
          if (first.select && first.type === "text") first.select();
        }
      }

      function closePopover(restoreFocus = true) {
        if (!popover) return;
        const fk = popover.anchorFk;
        popover = null;
        const el = id("popover");
        el.hidden = true;
        el.innerHTML = "";
        if (restoreFocus) focusFk(fk) || id("board").focus();
      }

      function popoverGroup() {
        const c = activeCategory();
        if (!c || !popover.axId) return null;
        const entry = c.values[popover.axId];
        return entry && entry.groups.find((g) => g.id === popover.groupId);
      }

      function renderPopover() {
        const el = id("popover");
        if (!popover) {
          el.hidden = true;
          return;
        }
        const c = activeCategory();
        let html = null;
        if (popover.kind === "condition" || popover.kind === "new-group") html = c && conditionPopoverHtml(c);
        else if (popover.kind === "category") html = c && categoryPopoverHtml(c);
        else if (popover.kind === "new-category") html = categoryPopoverHtml(null);
        else if (popover.kind === "insert-axis") html = insertAxisPopoverHtml();
        if (!html) {
          closePopover(false);
          return;
        }
        const fk = document.activeElement && el.contains(document.activeElement) ? document.activeElement.dataset.fk : null;
        el.innerHTML = html;
        el.hidden = false;
        positionPopover();
        if (fk) focusFk(fk);
      }

      function positionPopover() {
        const el = id("popover");
        if (!popover || el.hidden) return;
        const anchor = popover.anchorFk && document.querySelector(`[data-fk="${CSS.escape(popover.anchorFk)}"]`);
        const r = anchor ? anchor.getBoundingClientRect() : { left: 16, right: 16, top: 16, bottom: 16 };
        const w = el.offsetWidth;
        const h = el.offsetHeight;
        const left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
        let top = r.bottom + 6;
        if (top + h > window.innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
        el.style.left = left + "px";
        el.style.top = Math.max(8, top) + "px";
      }

      function conditionPopoverHtml(c) {
        const ax = axes.find((a) => a.id === popover.axId);
        if (!ax) return null;
        const isNew = popover.kind === "new-group";
        const group = isNew ? null : popoverGroup();
        if (!isNew && !group) return null;
        const condition = isNew ? popover.draft : group.condition;
        const rows = conditionOptions(c.id, ax.id, condition)
          .map(
            (o) => `<div class="cond-row" role="group" aria-label="${esc(o.name)}">
              <span class="cond-row-label ${hueClass(axes.find((a) => a.id === o.axId))}">${esc(o.name)}</span>
              <div class="cond-values">${o.values
                .map((v) => {
                  const on = (condition[o.axId] || []).includes(v);
                  return `<button type="button" class="cond-toggle" aria-pressed="${on}" data-pop="toggle" data-cond-ax="${esc(o.axId)}" data-value="${esc(v)}" data-fk="pop:${esc(o.axId)}:${esc(v)}">${esc(v)}</button>`;
                })
                .join("")}</div>
            </div>`,
          )
          .join("");
        const empty = !Object.keys(condition).length;
        return `<div class="pop-title" id="pop-title">${isNew ? "New group" : "Condition"} on ${esc(ax.name)}</div>
          <p class="pop-hint">${isNew ? "Pick the earlier values this group applies to." : "The group applies when a name has these values."} Values on one axis are alternatives; different axes must all match.</p>
          ${rows}
          ${popover.error ? `<p class="pop-hint is-error" role="alert">${esc(popover.error)}</p>` : ""}
          <div class="pop-actions">
            ${isNew
              ? `<button type="button" data-pop="close" data-fk="pop:cancel">Cancel</button>
                 <button type="button" class="btn-solid" data-pop="create-group" data-fk="pop:create" ${empty ? "disabled" : ""}>Add group</button>`
              : `<button type="button" class="btn-solid" data-pop="close" data-fk="pop:done">Done</button>`}
          </div>`;
      }

      function categoryPopoverHtml(c) {
        const isNew = !c;
        const type = isNew ? popover.draftType || "" : c.dtcgType || "";
        return `<form class="pop-form" data-pop-form="${isNew ? "create-category" : "update-category"}">
          <div class="pop-title" id="pop-title">${isNew ? "New category" : "Category"}</div>
          <label class="pop-field">Name
            <input type="text" name="name" value="${esc(isNew ? popover.draftName || "" : c.name)}" placeholder="e.g. color, spacing" data-fk="pop:cat-name" spellcheck="false" autocomplete="off" />
          </label>
          <label class="pop-field">Token type ($type)
            <select name="type" data-fk="pop:cat-type">${dtcgTypeOptionsHtml(type)}</select>
            ${isTerrazzoExtensionType(type) ? `<span class="token-type-extension-note">Terrazzo extension; output support may require a custom plugin.</span>` : ""}
          </label>
          ${popover.error ? `<p class="pop-hint is-error" role="alert">${esc(popover.error)}</p>` : ""}
          <div class="pop-actions">
            ${isNew
              ? `<button type="button" data-pop="close" data-fk="pop:cancel">Cancel</button>
                 <button type="submit" class="btn-solid" data-fk="pop:submit">Add category</button>`
              : `<button type="button" class="btn-ghost is-danger" data-pop="delete-category" data-fk="pop:delete">Delete</button>
                 <button type="submit" class="btn-solid" data-fk="pop:submit">Done</button>`}
          </div>
        </form>`;
      }

      function insertAxisPopoverHtml() {
        return `<form class="pop-form" data-pop-form="insert-axis">
          <div class="pop-title" id="pop-title">Insert axis</div>
          <p class="pop-hint">The new axis is added to every category${tierMode === "tier1" ? ", before scale" : ""}. Mark it Unused where it doesn't apply.</p>
          <label class="pop-field">Name
            <input type="text" name="name" value="${esc(popover.draftName || "")}" placeholder="e.g. family, role, state" data-fk="pop:axis-name" spellcheck="false" autocomplete="off" />
          </label>
          ${popover.error ? `<p class="pop-hint is-error" role="alert">${esc(popover.error)}</p>` : ""}
          <div class="pop-actions">
            <button type="button" data-pop="close" data-fk="pop:cancel">Cancel</button>
            <button type="submit" class="btn-solid" data-fk="pop:submit">Insert</button>
          </div>
        </form>`;
      }

      function onPopoverClick(btn) {
        const act = btn.dataset.pop;
        const c = activeCategory();
        if (act === "close") return closePopover();
        if (act === "toggle") {
          const { condAx, value } = btn.dataset;
          popover.error = null;
          if (popover.kind === "new-group") {
            const vals = popover.draft[condAx] || [];
            const next = vals.includes(value) ? vals.filter((v) => v !== value) : [...vals, value];
            if (next.length) popover.draft[condAx] = next;
            else delete popover.draft[condAx];
            renderPopover();
          } else if (!edit(() => toggleConditionValue(c.id, popover.axId, popover.groupId, condAx, value))) {
            popover.error = "A group needs at least one value in its condition. Remove the group instead.";
            renderPopover();
          }
          return;
        }
        if (act === "create-group") {
          let groupId = null;
          edit(() => (groupId = addGroup(c.id, popover.axId, popover.draft)) !== null);
          if (groupId) {
            popover.anchorFk = "add:" + groupId;
            closePopover();
          }
          return;
        }
        if (act === "delete-category") {
          if (!confirm(`Delete the "${c.name}" category and all its values? You can undo this.`)) return;
          closePopover(false);
          edit(() => removeCategory(c.id));
          showToast(`Deleted the "${c.name}" category.`);
          focusFk("tab:" + activeCatId) || id("board").focus();
        }
      }

      function onPopoverSubmit(form) {
        const kind = form.dataset.popForm;
        const name = form.elements.name.value;
        const type = form.elements.type ? form.elements.type.value : "";
        const c = activeCategory();
        if (kind === "create-category") {
          let catId = null;
          if (!edit(() => (catId = addCategory(name, type)) !== null)) {
            Object.assign(popover, { draftName: name, draftType: type, error: name.trim() ? `There's already a category called "${slugName(name)}".` : "Enter a name." });
            return renderPopover();
          }
          closePopover(false);
          selectCategory(catId);
          focusFk("tab:" + catId);
        } else if (kind === "update-category") {
          closePopover();
        } else if (kind === "insert-axis") {
          let axId = null;
          if (!edit(() => (axId = insertAxis(name)) !== null)) {
            const slug = slugName(name);
            Object.assign(popover, { draftName: name, error: !slug ? "Enter a name." : RESERVED_AXIS_NAMES.has(slug) ? `"${slug}" is reserved.` : `There's already an axis called "${slug}".` });
            return renderPopover();
          }
          closePopover(false);
          focusFk("add:" + allGroup(activeCategory().values[axId]).id);
          const col = document.querySelector(`[data-fk="axname:${CSS.escape(axId)}"]`);
          if (col) col.scrollIntoView({ block: "nearest", inline: "nearest" });
        }
      }

      // Category name and type apply as soon as they change.
      function onPopoverChange(target) {
        const form = target.form;
        if (!form || form.dataset.popForm !== "update-category") return;
        const c = activeCategory();
        if (target.name === "name") {
          if (!edit(() => renameCategory(c.id, target.value))) {
            popover.error = target.value.trim() ? `There's already a category called "${slugName(target.value)}".` : "A category needs a name.";
            renderPopover();
          } else popover.error = null;
        } else if (target.name === "type") {
          edit(() => setCategoryType(c.id, target.value));
        }
      }

      /* Board actions */
      function ref(el) {
        const c = activeCategory();
        return { c, axId: el.dataset.ax, groupId: el.dataset.group, index: Number(el.dataset.index) };
      }

      function onBoardClick(el) {
        const act = el.dataset.act;
        const { c, axId, groupId, index } = ref(el);
        switch (act) {
          case "select-category":
            return selectCategory(el.dataset.cat, true);
          case "new-category":
            return openPopover({ kind: "new-category" }, el);
          case "edit-category":
            return c && openPopover({ kind: "category" }, el);
          case "insert-axis":
            return openPopover({ kind: "insert-axis" }, el);
          case "remove-axis":
            return uiRemoveAxis(axId);
          case "new-group":
            return openPopover({ kind: "new-group", axId, draft: {} }, el);
          case "edit-condition":
            return openPopover({ kind: "condition", axId, groupId }, el);
          case "remove-group":
            pendingFocusFk = "addgroup:" + axId;
            return edit(() => removeGroup(c.id, axId, groupId));
          case "remove-value": {
            const next = `val:${groupId}:${index}`;
            return edit(() => removeGroupValue(c.id, axId, groupId, index)) &&
              (focusFk(next) || focusFk(`val:${groupId}:${index - 1}`) || focusFk("add:" + groupId));
          }
        }
      }

      function onBoardChange(el) {
        const act = el.dataset.act;
        const { c, axId, groupId, index } = ref(el);
        switch (act) {
          case "rename-axis":
            if (!edit(() => renameAxis(axId, el.value)))
              showToast(
                slugName(el.value)
                  ? `"${slugName(el.value)}" is reserved or already used by another axis.`
                  : "An axis needs a name.",
                false,
              );
            return;
          case "toggle-used":
            return edit(() => setAxisUnused(c.id, axId, !el.checked));
          case "set-generator":
            return edit(() => setGroupGenerator(c.id, axId, groupId, el.value));
          case "set-config":
            return edit(() => setGeneratorConfig(c.id, axId, groupId, el.dataset.key, el.value));
          case "set-group-type":
            return edit(() => setGroupTokenType(c.id, axId, groupId, el.value));
          case "rename-value":
            return el.value.trim()
              ? edit(() => renameGroupValue(c.id, axId, groupId, index, el.value))
              : edit(() => removeGroupValue(c.id, axId, groupId, index));
          case "add-value":
            return commitAddValue(el);
        }
      }

      function commitAddValue(el) {
        const { c, axId, groupId } = ref(el);
        const values = parseCustomList(el.value);
        if (!values.length) return;
        pendingFocusFk = "add:" + groupId;
        // Commas add several values at once, like the old literal list field.
        edit(() => values.map((v) => addGroupValue(c.id, axId, groupId, v)).some(Boolean));
      }

      // Moving an axis past another drops conditions that would then point
      // forward; say which groups go before doing it.
      /* Moving axes: drag a column's grip, or press ← → on it */
      // Board columns map to the formula after namespace and category, which
      // never move, so column position p is formula index offset + p.
      function boardIndexOffset() {
        return axes.length - boardAxes().length;
      }

      // Moves an axis as one undo step. If some groups lose part of their
      // condition, a toast says where, with Undo.
      function uiMoveAxis(axId, index) {
        if (!canMoveAxisTo(axId, index)) return false;
        const ax = axes.find((a) => a.id === axId);
        const lost = conditionsLostByMove(axId, index);
        pendingFocusFk = "grip:" + axId;
        edit(() => moveAxisTo(axId, index));
        const cols = boardAxes();
        id("board-status").textContent =
          `${ax.name} moved to column ${cols.indexOf(ax) + 1} of ${cols.length}.`;
        if (lost.length) {
          showToast(`Moved ${ax.name}. Groups lost part of their condition in: ${lost.join(", ")}.`);
        }
        return true;
      }

      function onGripKeydown(e) {
        const axId = e.target.dataset.ax;
        const i = axisIndexById(axId);
        const offset = boardIndexOffset();
        const scaleIdx = scaleAxisIndex();
        const last = (scaleIdx >= 0 ? scaleIdx : axes.length) - 1;
        let to = null;
        if (e.key === "ArrowLeft") to = i - 1;
        else if (e.key === "ArrowRight") to = i + 1;
        else if (e.key === "Home") to = offset;
        else if (e.key === "End") to = last;
        if (to === null) return;
        e.preventDefault();
        uiMoveAxis(axId, to);
      }

      // Pointer drag: the column follows the pointer, a bar shows where it
      // will land, and the board scrolls when the pointer nears its edges.
      // Escape cancels.
      let axisDrag = null;
